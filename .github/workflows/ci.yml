name: CI

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Free space for Docker images and Rust artifacts
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v4
      - name: Set container ownership
        run: |
          echo "STRATA_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "STRATA_GID=$(id -g)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: dev/Dockerfile
          tags: strata-dev:local
          load: true
          build-args: |
            HOST_UID=${{ env.STRATA_UID }}
            HOST_GID=${{ env.STRATA_GID }}
          cache-from: type=gha,scope=strata-dev
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=strata-dev,mode=max' || '' }}
      - name: Verify builds and unit tests
        run: ./x ci
      - id: test-int
        name: Run integration tests
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) }}
        run: ./x test-int
      - name: Show fixture logs on failure
        if: ${{ failure() && steps.test-int.outcome == 'failure' }}
        run: docker compose logs --tail 40 postgres mssql oracle
      - name: Tear down containers
        if: always()
        run: ./x down
