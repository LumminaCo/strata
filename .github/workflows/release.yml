name: Bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_artifact_run:
        description: "Run ID of a Windows bundle to retest"
        type: string
        required: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.5
  NODE_VERSION: 24.22.3
  TAURI_CLI_VERSION: 2.12.6
  VP_VERSION: 1.7.0

jobs:
  linux-and-windows-bundles:
    if: ${{ !inputs.windows_artifact_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
    steps:
      - uses: actions/checkout@v6
      - name: Free space for Docker images and Rust artifacts
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v4
      - name: Set container ownership
        run: |
          echo "STRATA_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "STRATA_GID=$(id -g)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: dev/Dockerfile
          tags: strata-dev:local
          load: true
          build-args: |
            HOST_UID=${{ env.STRATA_UID }}
            HOST_GID=${{ env.STRATA_GID }}
          cache-from: type=gha,scope=strata-dev
      - run: ./x bundle-${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: strata-${{ matrix.platform }}-x64
          path: artifacts/
          if-no-files-found: error

  windows-native:
    if: ${{ !cancelled() && (needs.linux-and-windows-bundles.result == 'success' || inputs.windows_artifact_run) }}
    runs-on: windows-latest
    timeout-minutes: 45
    needs: linux-and-windows-bundles
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: strata-windows-x64
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_artifact_run || github.run_id }}
      - name: Install and open the Windows bundle
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts -Filter '*.exe' | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP "Strata"
          $setup = Start-Process $installer.FullName -ArgumentList "/S", "/D=$destination" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "The installer returned $($setup.ExitCode)." }
          $binary = Join-Path $destination "strata.exe"
          $bridge = Join-Path $destination "oracle-bridge.exe"
          if (!(Test-Path $bridge)) { throw "The Oracle sidecar is missing from the installation." }
          $env:STRATA_HOME = Join-Path $env:RUNNER_TEMP "strata-smoke-home"
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process $binary -PassThru
          $opened = $false
          try {
            for ($attempt = 0; $attempt -lt 300; $attempt++) {
              Start-Sleep -Milliseconds 100
              $process.Refresh()
              if ($process.HasExited) { throw "Strata exited during startup." }
              if ($process.MainWindowTitle -eq "Strata") {
                $clock.Stop()
                $opened = $true
                break
              }
            }
            if (!$opened) { throw "The Strata window did not open." }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
          "Windows installer bytes $($installer.Length)" >> $env:GITHUB_STEP_SUMMARY
          "Windows startup to window title $($clock.ElapsedMilliseconds) ms" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Windows startup to window title $($clock.ElapsedMilliseconds) ms"
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = $binary
          $start.Arguments = "mcp"
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $mcp = [System.Diagnostics.Process]::Start($start)
          try {
            $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"bundle-smoke","version":"1.0"}}}')
            $read = $mcp.StandardOutput.ReadLineAsync()
            if (!$read.Wait(15000)) { throw "The installed MCP server did not initialize." }
            $reply = $read.Result | ConvertFrom-Json
            if ($reply.result.serverInfo.name -ne "strata") { throw "Unexpected MCP server identity." }
          } finally {
            $mcp.StandardInput.Close()
            if (!$mcp.WaitForExit(5000)) { $mcp.Kill() }
          }
      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/oracle/go.mod
          cache-dependency-path: bridge/oracle/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Vite+
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/voidzero-dev/vite-plus/releases/download/v$env:VP_VERSION/vp-x86_64-pc-windows-msvc.zip" -OutFile "$env:RUNNER_TEMP/vp.zip"
          Expand-Archive "$env:RUNNER_TEMP/vp.zip" -DestinationPath "$env:RUNNER_TEMP/vp"
          (Get-ChildItem "$env:RUNNER_TEMP/vp" -Recurse -Filter vp.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
          "VP_NODE_MANAGER=no" >> $env:GITHUB_ENV
          "VP_PACKAGE_MANAGER=bun@$env:BUN_VERSION" >> $env:GITHUB_ENV
      - run: vp install --frozen-lockfile
      - run: vp build
        working-directory: apps/desktop
      - run: cargo test --locked --workspace

  macos-arm64:
    if: ${{ !inputs.windows_artifact_run }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/oracle/go.mod
          cache-dependency-path: bridge/oracle/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Vite+ and Tauri
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/strata-tools"
          curl -fsSL "https://github.com/voidzero-dev/vite-plus/releases/download/v$VP_VERSION/vp-aarch64-apple-darwin.tar.gz" -o "$RUNNER_TEMP/vp.tar.gz"
          tar -xzf "$RUNNER_TEMP/vp.tar.gz" -C "$RUNNER_TEMP/strata-tools" vp
          curl -fsSL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$TAURI_CLI_VERSION/cargo-tauri-aarch64-apple-darwin.zip" -o "$RUNNER_TEMP/cargo-tauri.zip"
          unzip -q "$RUNNER_TEMP/cargo-tauri.zip" -d "$RUNNER_TEMP/strata-tools"
          echo "$RUNNER_TEMP/strata-tools" >> "$GITHUB_PATH"
          echo "VP_NODE_MANAGER=no" >> "$GITHUB_ENV"
          echo "VP_PACKAGE_MANAGER=bun@$BUN_VERSION" >> "$GITHUB_ENV"
      - run: vp install --frozen-lockfile
      - run: vp build
        working-directory: apps/desktop
      - run: cargo test --locked --workspace
      - run: cargo tauri build --target aarch64-apple-darwin --bundles dmg -- --locked
        working-directory: apps/desktop
      - name: Verify the mounted DMG
        run: |
          disk="$(find target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          mount="$RUNNER_TEMP/strata-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -mountpoint "$mount" "$disk"
          trap 'hdiutil detach "$mount"' EXIT
          binaries="$mount/Strata.app/Contents/MacOS"
          test -x "$binaries/oracle-bridge"
          "$binaries/strata" --version
          printf 'macOS installer bytes %s\n' "$(stat -f %z "$disk")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: strata-macos-arm64
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
