name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Set container ownership
        run: |
          echo "STRATA_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "STRATA_GID=$(id -g)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: dev/Dockerfile
          tags: strata-dev:local
          load: true
          build-args: |
            HOST_UID=${{ env.STRATA_UID }}
            HOST_GID=${{ env.STRATA_GID }}
          cache-from: type=gha,scope=strata-dev
          cache-to: type=gha,scope=strata-dev,mode=max
      - run: ./x ci
      - run: ./x test-int
      - name: Show fixture logs on failure
        if: failure()
        run: docker compose logs --tail 40 postgres mssql oracle
      - if: always()
        run: ./x down
