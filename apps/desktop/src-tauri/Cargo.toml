[package]
name = "strata"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
directories.workspace = true
serde_json.workspace = true
strata-app.workspace = true
strata-mcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = [
  "client",
  "transport-child-process",
] }
tempfile.workspace = true
strata-store.workspace = true
