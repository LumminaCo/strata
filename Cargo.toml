[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
tauri = "2.12.7"
tauri-build = "2.7.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors"] }
strata-app = { path = "crates/strata-app" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = "line-tables-only"
